<!DOCTYPE html>
<html lang="zh-CN" data-auth="login">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HV Lab · 内部访问</title>
<meta name="description" content="实验室内部页面，需要账号密码登录后访问。">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css?v=1794754560">
<style>
  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
    background: var(--bg-soft);
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    padding: 30px 28px 24px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
  }
  .login-brand {
    margin: 0 0 18px;
    font-size: 13px;
    color: var(--text-3);
    letter-spacing: .02em;
  }
  .login-card h1 {
    margin: 0 0 8px;
    font-size: 20px;
    line-height: 1.3;
  }
  .login-hint {
    margin: 0 0 20px;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text-2);
  }
  .login-field { display: block; margin-bottom: 14px; }
  .login-field > span {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    color: var(--text-2);
  }
  .login-field input {
    width: 100%;
    height: 38px;
    padding: 0 11px;
    border: 1px solid var(--line-2);
    border-radius: 9px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 13.5px;
  }
  .login-field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .login-remember {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 2px 0 16px;
    font-size: 12.5px;
    color: var(--text-2);
    cursor: pointer;
  }
  .login-remember input { width: auto; margin: 0; }
  .login-msg {
    min-height: 18px;
    margin: 0 0 10px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #c0392b;
  }
  .login-msg.is-ok { color: #0d7a4f; }
  .login-submit {
    width: 100%;
    height: 40px;
    border: 0;
    border-radius: 10px;
    background: var(--text);
    color: var(--bg);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-submit:hover { opacity: .88; }
  .login-submit[disabled] { opacity: .55; cursor: default; }
  .login-foot {
    margin: 16px 0 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
  }
  .login-foot a { color: var(--text-2); }
</style>
</head>
<body>
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  })();
</script>

<main class="login-page">
  <form class="login-card" id="loginForm" novalidate>
    <p class="login-brand">HV Lab</p>
    <h1>内部访问</h1>
    <p class="login-hint">本站仅对实验室内部人员开放，请输入后台设置的账号与密码。</p>

    <label class="login-field">
      <span>账号</span>
      <input id="loginAccount" type="text" maxlength="32" autocomplete="username" autofocus>
    </label>
    <label class="login-field">
      <span>密码</span>
      <input id="loginPassword" type="password" maxlength="64" autocomplete="current-password">
    </label>

    <label class="login-remember">
      <input id="loginRemember" type="checkbox" checked> 在本机记住登录状态
    </label>

    <p class="login-msg" id="loginMsg" role="alert"></p>
    <button class="login-submit" id="loginSubmit" type="submit">登录</button>
    <p class="login-foot"><a href="index.html">返回主页</a></p>
  </form>
</main>

<script src="assets/js/hv-gate-config.js?v=8a95ed1c"></script>
<script src="assets/js/hv-gate.js?v=1794754560"></script>
<script>
(function () {
  "use strict";

  var form = document.getElementById("loginForm");
  var msg = document.getElementById("loginMsg");
  var btn = document.getElementById("loginSubmit");
  var next = HVGate.safeNext();
  var params = null;
  try { params = new URLSearchParams(location.search); } catch (e) { params = null; }
  var loggingOut = !!(params && params.has("logout"));

  if (!HVGate.enabled()) {
    msg.textContent = "当前站点未启用访问控制，可直接进入。";
    btn.textContent = "进入网站";
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      location.replace("index.html");
    });
    var inputs = form.querySelectorAll("input");
    for (var i = 0; i < inputs.length; i += 1) inputs[i].disabled = true;
    return;
  }

  if (loggingOut) {
    HVGate.signOut();
    msg.className = "login-msg is-ok";
    msg.textContent = "已退出登录。";
  } else if (HVGate.isAuthed()) {
    msg.className = "login-msg is-ok";
    msg.textContent = "已登录，正在进入…";
    location.replace(next);
    return;
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var account = (document.getElementById("loginAccount").value || "").replace(/^\s+|\s+$/g, "");
    var password = document.getElementById("loginPassword").value || "";
    var remember = document.getElementById("loginRemember").checked;

    if (!account || !password) {
      msg.className = "login-msg";
      msg.textContent = "请输入账号和密码";
      return;
    }

    btn.disabled = true;
    btn.textContent = "验证中…";
    msg.className = "login-msg";
    msg.textContent = "";

    HVGate.signIn(account, password, remember).then(function (ok) {
      if (ok) {
        msg.className = "login-msg is-ok";
        msg.textContent = "验证通过，正在进入…";
        location.replace(next);
        return;
      }
      msg.className = "login-msg";
      msg.textContent = "账号或密码不正确";
      btn.disabled = false;
      btn.textContent = "登录";
      document.getElementById("loginPassword").value = "";
      document.getElementById("loginPassword").focus();
    }).catch(function (err) {
      msg.className = "login-msg";
      msg.textContent = (err && err.message) || "验证失败，请重试";
      btn.disabled = false;
      btn.textContent = "登录";
    });
  });
})();
</script>
</body>
</html>
